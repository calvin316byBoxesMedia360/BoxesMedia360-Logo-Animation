name: Render Pro Menu Video

on:
  workflow_dispatch:
    inputs:
      menu_props:
        description: 'JSON con las propiedades del menú'
        required: true
        default: '{}'
      filename:
        description: 'Nombre del archivo de salida'
        required: true
        default: 'menu-video.mp4'

jobs:
  render:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v4
        id: npm-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Remotion binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: ${{ runner.os }}-remotion-${{ hashFiles('**/package.json') }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Ensure Remotion dependencies
        run: npx remotion browser ensure

      - name: Render video
        run: |
          npx remotion render src/Root.tsx PremiumMenuDynamic out/${{ github.event.inputs.filename }} --props '${{ github.event.inputs.menu_props }}'

      - name: Upload to Firebase Storage
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Solo ejecutamos esto si el secreto está configurado
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "📤 Subiendo a Firebase Storage..."
            # Aquí iría un script de node para subir el archivo usando el service account
            node scripts/upload-to-storage-action.js out/${{ github.event.inputs.filename }}
          else
            echo "⚠️ Secreto FIREBASE_SERVICE_ACCOUNT no configurado. Solo se guardará como artifact de GitHub."
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.filename }}
          path: out/${{ github.event.inputs.filename }}
          retention-days: 7
