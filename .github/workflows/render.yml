name: Render Remotion Video

on:
  push:
    branches: [main]
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  render:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render HolographicParticlesV2 out/holographic-v2.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: holographic-v2-video
          path: out/holographic-v2.mp4
          retention-days: 30
